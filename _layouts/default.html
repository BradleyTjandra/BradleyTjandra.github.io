<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" type="text/css" href="/css/main.css?v={{ site.time | date: '%s' }}">
    <script>
      (function () {
        try {
          var s = localStorage.getItem('blog-font-scale');
          if (s) document.documentElement.style.setProperty('--font-scale', s);
        } catch (e) {}
      })();
    </script>
    {% seo %}
    {% feed_meta %}
  </head>
  <body>
    <div class="content">
      {% include header.html %}
      <div class="container">
        {{ content }}
      </div>
      {% include footer.html %}
    </div>
    <script src="/assets/js/font-size.js?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
