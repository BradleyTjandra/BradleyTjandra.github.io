<p class="font-controls" aria-label="Adjust text size">
  <button type="button" class="font-btn font-decrease" id="font-decrease" aria-label="Decrease text size">
    <span class="font-icon">A<svg class="font-chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" /></svg></span>
  </button>
  <button type="button" class="font-size-readout" id="font-size-reset" aria-label="Reset text size" aria-live="polite">100%</button>
  <button type="button" class="font-btn font-increase" id="font-increase" aria-label="Increase text size">
    <span class="font-icon">A<svg class="font-chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 5l4-4 4 4" /></svg></span>
  </button>
</p>
